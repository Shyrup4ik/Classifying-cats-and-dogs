limit_req_zone $binary_remote_addr zone=predictions:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    error_page 413 = @too_large;
    error_page 429 = @too_many;
    location @too_large {
        default_type application/json;
        return 413 '{"detail":"Файл слишком большой: максимум 10 МБ."}';
    }
    location @too_many {
        default_type application/json;
        return 429 '{"detail":"Слишком много запросов. Подождите минуту и попробуйте снова."}';
    }

    location /api/predict {
        limit_req zone=predictions burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
